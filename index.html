<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sahana's coding journey and technology interests">
  <title>Sahana K S | Portfolio</title>

  <style>
    :root {
      --bg: #0b0913;
      --card: #171225;
      --text: #f5f0ff;
      --muted: #bdb2d0;
      --accent: #c5a3ff;
      --border: #35264a;
    }

    body.light {
      --bg: #faf7ff;
      --card: #ffffff;
      --text: #251735;
      --muted: #655774;
      --accent: #7542bb;
      --border: #e5d9f3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 8%;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo {
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    nav a {
      color: var(--text);
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    main {
      width: 84%;
      max-width: 1000px;
      margin: auto;
    }

    .hero {
      padding: 90px 0 65px;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.85rem;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.2;
      margin: 15px 0;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    h3 {
      margin-bottom: 8px;
    }

    .highlight {
      color: var(--accent);
    }

    .hero p,
    .intro,
    .card p {
      color: var(--muted);
    }

    .hero p,
    .intro {
      max-width: 700px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      margin-top: 25px;
    }

    .primary {
      display: inline-block;
      padding: 11px 17px;
      border-radius: 9px;
      background: var(--accent);
      color: #160d25;
      font-weight: bold;
    }

    section {
      padding: 35px 0;
      scroll-margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .card {
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--card);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .tag {
      display: inline-block;
      padding: 5px 12px;
      margin: 6px 5px 0 0;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      margin-top: 45px;
      padding: 25px;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--muted);
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 6%;
      }

      main {
        width: 88%;
      }

      .hero {
        padding-top: 60px;
      }

      nav {
        gap: 12px;
      }
    }
  </style>
</head>
